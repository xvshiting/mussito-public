name: 使用问题
description: 安装、连接、音频或输入出现异常
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: "此反馈公开可见。请勿上传配对二维码、访问凭据、私人录音或未处理的私人文本。"
  - type: input
    id: version
    attributes:
      label: Mussito 版本
      placeholder: "Mac 与 iPhone 两端版本（如适用）"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 设备与系统
      description: "Mac 型号/芯片、macOS 版本、iPhone 型号和 iOS 版本。不要填写设备序列号。"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 问题发生在哪一部分？
      options:
        - 安装或权限
        - 配对与连接
        - 录音或音频组件
        - 文字识别与输入
        - 声纹过滤
        - 其他
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤、实际结果与预期结果
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: "可附已经检查过私人信息的截图。无需提供录音、原文或配对资料。"
